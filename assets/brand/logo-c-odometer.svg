<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Tanque Cheio — Logo C: Odômetro estilizado mostrando "FULL"</title>
  <rect width="256" height="256" fill="#000000"/>
  <!-- Moldura externa do odômetro (retângulo arredondado fino) -->
  <rect x="40" y="92" width="176" height="72" rx="10" ry="10"
        fill="none" stroke="#1F1F23" stroke-width="2"/>
  <!-- Janelas de dígitos (5 slots, como velocímetro analógico) -->
  <g fill="#0A0A0C" stroke="#1F1F23" stroke-width="1">
    <rect x="56" y="108" width="28" height="40" rx="2"/>
    <rect x="88" y="108" width="28" height="40" rx="2"/>
    <rect x="120" y="108" width="28" height="40" rx="2"/>
    <rect x="152" y="108" width="28" height="40" rx="2"/>
    <rect x="184" y="108" width="16" height="40" rx="2"/>
  </g>
  <!-- Dígitos em Bodoni-feel mostrando "FULL." -->
  <g fill="#E8A85C" font-family="Georgia, 'Times New Roman', serif" font-weight="500"
     text-anchor="middle" font-size="32">
    <text x="70" y="138">F</text>
    <text x="102" y="138">U</text>
    <text x="134" y="138">L</text>
    <text x="166" y="138">L</text>
  </g>
  <!-- Ponto pulsante final (estado "cheio") -->
  <circle cx="192" cy="138" r="3" fill="#E8A85C"/>
  <!-- Linha de status fina no topo -->
  <g>
    <rect x="56" y="80" width="144" height="2" fill="#1F1F23"/>
    <rect x="56" y="80" width="144" height="2" fill="#E8A85C"/>
  </g>
  <!-- Etiqueta inferior em jost-italic feel -->
  <text x="128" y="184" text-anchor="middle"
        font-family="Georgia, serif" font-style="italic" font-size="11" fill="#5C5852">
    tanque cheio
  </text>
</svg>
