name            = "tanquecheio-api"
main            = "src/index.ts"
compatibility_date = "2026-04-28"

# Replace with your Cloudflare account ID (find it in the dashboard URL)
account_id      = "781543d23ead6fb7cfd32dd22146e9c4"

[vars]
ALLOWED_ORIGINS = "https://tanquecheio.pages.dev,https://tanquecheio.netlify.app,http://localhost:5173,http://localhost:5174"

# Required secrets (set via `wrangler secret put`):
#   VAULT_PASSWORD  — master password for vault authentication
#   JWT_SECRET      — hex key for signing presigned photo URLs
#   VAPID_PUBLIC    — base64url public key for Web Push notifications
#   VAPID_PRIVATE   — base64url private key for Web Push notifications
#   VAPID_SUBJECT   — contact email for VAPID (e.g. "mailto:admin@tanquecheio.app")

[[d1_databases]]
binding       = "DB"
database_name = "tanquecheio-db"
database_id   = "72605e35-d668-4353-b557-c79d01e967c8"

[[r2_buckets]]
binding     = "STORAGE"
bucket_name = "tanquecheio-storage"

# Rate limiting do endpoint /api/auth (PROJETO §7.1).
# 5 tentativas por chave (IP) a cada 60s. namespace_id é arbitrário (privado por Worker).
[[unsafe.bindings]]
name         = "AUTH_LIMITER"
type         = "ratelimit"
namespace_id = "1001"
simple       = { limit = 5, period = 60 }

[triggers]
crons = ["0 11 * * *"]
