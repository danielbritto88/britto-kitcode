<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="#F4EFE6"/>
  <!-- Border -->
  <rect x="8" y="8" width="496" height="496" rx="40" fill="none" stroke="#0D0D0D" stroke-width="16"/>
  <!-- Inner border -->
  <rect x="24" y="24" width="464" height="464" rx="28" fill="none" stroke="#0D0D0D" stroke-width="4" opacity="0.15"/>
  <!-- TC text -->
  <text x="256" y="320" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="200" font-weight="700"
        fill="#0D0D0D">TC</text>
  <!-- Yellow accent line -->
  <rect x="100" y="360" width="312" height="24" rx="4" fill="#F5D000" stroke="#0D0D0D" stroke-width="4"/>
</svg>
